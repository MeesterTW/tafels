<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Tafels oefenen</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eaf6ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.game {
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 380px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 { color: #1e90ff; }

.tables {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    justify-items: start;
}

.timer-bar {
    height: 18px;
    background: #1e90ff;
    border-radius: 10px;
    margin-bottom: 10px;
    transition: width 1s linear;
}

input {
    font-size: 22px;
    width: 100px;
    text-align: center;
}

button {
    margin-top: 10px;
    padding: 10px 18px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: #1e90ff;
    color: white;
    cursor: pointer;
}

button:disabled {
    background: #aaa;
}

.feedback {
    margin-top: 10px;
    font-weight: bold;
}

.info {
    margin-top: 6px;
    color: #1e90ff;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="game">
    <h2>Tafels oefenen</h2>

    <p><b>Kies tafels:</b></p>
    <div class="tables" id="tables"></div>

    <button id="startBtn">START</button>

    <div class="timer-bar" id="timerBar"></div>

    <div id="question">Kies tafels en druk op start</div>

    <input type="number" id="answer" disabled>
    <br>
    <button id="checkBtn" disabled>CHECK</button>

    <div class="feedback" id="feedback"></div>

    <div class="info">Goed achter elkaar: <span id="score">0</span> / 20</div>
    <div class="info">Totale tijd: <span id="totalTime">0s</span></div>
    <div class="info">Recordtijd: <span id="recordTime">--</span></div>
</div>

<canvas id="confetti"></canvas>

<script>
const TIME_LIMIT = 5;

let tablesChosen = [];
let a, b;
let score = 0;
let repeatSame = false;
let timeLeft, timer;
let startTime, totalTimer, elapsedTime = 0;
let record = localStorage.getItem("tafelsRecord");

const tablesDiv = document.getElementById("tables");
const startBtn = document.getElementById("startBtn");
const answerInput = document.getElementById("answer");
const checkBtn = document.getElementById("checkBtn");
const questionDiv = document.getElementById("question");
const feedbackDiv = document.getElementById("feedback");
const scoreSpan = document.getElementById("score");
const timerBar = document.getElementById("timerBar");
const totalTimeSpan = document.getElementById("totalTime");
const recordTimeSpan = document.getElementById("recordTime");

recordTimeSpan.innerText = record ? record + "s" : "--";

for (let i = 1; i <= 10; i++) {
    tablesDiv.innerHTML += `
        <label><input type="checkbox" value="${i}"> ${i}</label>
    `;
}

startBtn.onclick = () => {
    tablesChosen = [...document.querySelectorAll("input[type=checkbox]:checked")]
        .map(c => Number(c.value));

    if (tablesChosen.length === 0) {
        alert("Kies minstens één tafel");
        return;
    }

    clearInterval(timer);
    clearInterval(totalTimer);

    score = 0;
    elapsedTime = 0;
    repeatSame = false;
    scoreSpan.innerText = "0";
    totalTimeSpan.innerText = "0s";
    feedbackDiv.innerText = "";

    startBtn.disabled = true;
    answerInput.disabled = false;
    checkBtn.disabled = false;
    answerInput.value = "";
    answerInput.focus();

    startTime = Date.now();
    totalTimer = setInterval(() => {
        elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        totalTimeSpan.innerText = elapsedTime + "s";
    }, 1000);

    newQuestion();
};

answerInput.addEventListener("keydown", e => {
    if (e.key === "Enter") checkAnswer();
});

checkBtn.onclick = checkAnswer;

function startTimer() {
    clearInterval(timer);
    timeLeft = TIME_LIMIT;
    updateBar();

    timer = setInterval(() => {
        timeLeft--;
        updateBar();
        if (timeLeft <= 0) {
            clearInterval(timer);
            wrong(`⏰ Tijd voorbij! ${a} × ${b} = ${a*b}`);
        }
    }, 1000);
}

function updateBar() {
    timerBar.style.width = (timeLeft / TIME_LIMIT) * 100 + "%";
    timerBar.style.background = timeLeft <= 1 ? "#ff4d4d" : "#1e90ff";
}

function newQuestion() {
    if (!repeatSame) {
        a = tablesChosen[Math.floor(Math.random() * tablesChosen.length)];
        b = Math.floor(Math.random() * 10) + 1;
    }
    repeatSame = false;

    questionDiv.innerText = `${a} × ${b} = ?`;
    answerInput.value = "";
    feedbackDiv.innerText = "";
    answerInput.focus();
    startTimer();
}

function wrong(msg) {
    score = 0;
    scoreSpan.innerText = score;
    feedbackDiv.innerText = msg + " → opnieuw!";
    repeatSame = true;
    setTimeout(newQuestion, 1200);
}

function checkAnswer() {
    clearInterval(timer);
    const user = Number(answerInput.value);
    const correct = a * b;

    if (user === correct) {
        score++;
        scoreSpan.innerText = score;
        feedbackDiv.innerText = "✅ Goed!";
        if (score === 20) finish();
        else setTimeout(newQuestion, 600);
    } else {
        wrong(`❌ Fout! ${a} × ${b} = ${correct}`);
    }
}

function finish() {
    clearInterval(timer);
    clearInterval(totalTimer);

    questionDiv.innerText = "🎉 GEHAALD!";
    feedbackDiv.innerText = `20 goed in ${elapsedTime}s`;
    answerInput.disabled = true;
    checkBtn.disabled = true;

    if (!record || elapsedTime < record) {
        localStorage.setItem("tafelsRecord", elapsedTime);
        recordTimeSpan.innerText = elapsedTime + "s";
        feedbackDiv.innerText += " 🏆 NIEUW RECORD!";
    }

    startBtn.disabled = false;
    startBtn.innerText = "OPNIEUW STARTEN";

    confetti();
}

function confetti() {
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    canvas.width = innerWidth;
    canvas.height = innerHeight;

    const pieces = Array.from({length:150}, () => ({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height - canvas.height,
        c: `hsl(${Math.random()*360},100%,50%)`
    }));

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p => {
            ctx.strokeStyle = p.c;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x+4, p.y+10);
            ctx.stroke();
            p.y += 3;
            if (p.y > canvas.height) p.y = -20;
        });
        requestAnimationFrame(draw);
    }
    draw();
}
</script>

</body>
</html>
